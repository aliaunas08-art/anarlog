[package]
name = "tauri-plugin-session"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/node_modules"]
links = "tauri-plugin-session"
description = ""

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
anlg-db-core = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[dependencies]
anlg-aspc = { workspace = true, features = ["tauri"] }
anlg-audit-log = { workspace = true, features = ["tauri"] }
anlg-db-app = { workspace = true }
tauri-plugin-db = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs2 = { workspace = true }
tauri-plugin-settings = { workspace = true }
tauri-plugin-tantivy = { workspace = true }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }

specta = { workspace = true, features = ["serde_json"] }
# ASPC C5 backup archives. MIT OR Apache-2.0; already in Cargo.lock.
tar = "0.4"
tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
