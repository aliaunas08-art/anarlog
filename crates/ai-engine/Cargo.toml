[package]
name = "ai-engine"
version = "0.1.0"
edition = "2024"
description = "Efficiency Engine (ASPC C7): the one gateway every AI call goes through. Locked model, local usage counter, quotas and rate limit, typed pause errors, and the Direct/Proxy endpoint config."

[features]
default = []
specta = ["dep:specta"]

[dependencies]
anlg-local-accounts = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml = { workspace = true }
wiremock = { workspace = true }
