[package]
name = "device-auth"
version = "0.1.0"
edition = "2024"
description = "Touch ID / password prompt and system idle time, for processes without a Tauri app (the CLI and MCP server)"

[dependencies]
tracing = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-local-authentication = { workspace = true, features = ["LAContext", "block2"] }
